<!DOCTYPE html>
<html lang="en">

    <div class="final">
        <div class="frame"><img src="/static/o.webp"></div>
        <p class="text">
            "<i>Als ich im tiefsten Herzeleid, grenzenlos vereinsamt im fremden Land, am Rande des Urwaldes, diese Aufzeichnungen niederzuschreiben begann, da geschah es mir selbst zum Trost.</i>"
            <br><br>
